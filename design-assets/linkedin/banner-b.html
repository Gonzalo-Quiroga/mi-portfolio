<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Banner LinkedIn B — statement + banda de stack</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="banner-base.css" />
    <style>
      /*
        Variante editorial: el statement a dos tonos manda y la banda de stack
        del sitio (StackMarquee) queda congelada al pie como zócalo.
        Fondo más plano que la A, con el bloom cian corrido a la derecha para
        no chocar con el arranque del titular.
      */
      .bg {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            56% 110% at 26% 30%,
            oklch(0.3 0.004 285 / 0.42),
            transparent 70%
          ),
          radial-gradient(700px 340px at 88% 84%, var(--a1-ambient), transparent 72%),
          linear-gradient(to bottom, oklch(0.182 0.002 285) 0%, var(--background) 72%);
      }

      .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          115% 135% at 45% 40%,
          transparent 36%,
          var(--background) 100%
        );
      }

      main {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding-top: 46px; /* respira bajo la línea de identidad de arriba */
        padding-right: var(--safe-right);
        padding-bottom: 82px; /* deja libre el zócalo */
        padding-left: var(--safe-left);
      }

      .topline {
        position: absolute;
        top: 46px;
        left: var(--safe-left);
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .mark {
        position: absolute;
        top: 42px;
        right: var(--safe-right);
        width: 30px;
        height: 30px;
        opacity: 0.72;
      }

      .statement {
        max-width: 1120px;
        font-size: 50px;
        font-weight: 500;
        letter-spacing: -0.025em;
        line-height: 1;
        text-transform: uppercase;
      }

      /*
        El apagado a gris cae a mitad de frase, no al final de una oración
        (§3.3): es lo que da la sensación de texto que se desvanece.
      */
      .statement .fade {
        color: oklch(0.6 0.004 285);
      }

      /* Zócalo: hairline + stack estático, con los extremos fundidos. */
      .band {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        padding: 17px 0 21px;
      }

      .band .hairline {
        position: absolute;
        top: 0;
        right: 0;
        left: 0;
      }

      .band ul {
        display: flex;
        align-items: center;
        gap: 26px;
        list-style: none;
        white-space: nowrap;
        /* El fundido izquierdo arranca pasada la foto de perfil de LinkedIn. */
        mask-image: linear-gradient(
          90deg,
          transparent 2%,
          #000 22%,
          #000 86%,
          transparent 97%
        );
        padding-left: 60px;
      }

      .band li {
        display: flex;
        align-items: center;
        gap: 26px;
      }

      .band li::after {
        content: "";
        display: block;
        width: 4px;
        height: 4px;
        background: color-mix(in oklch, var(--muted-foreground) 50%, transparent);
      }
    </style>
  </head>
  <body>
    <div class="bg"></div>
    <div class="vignette"></div>

    <div class="corners">
      <i style="top: 28px; left: 28px"></i>
      <i style="bottom: 96px; right: 28px"></i>
    </div>

    <div class="topline">
      <span class="marker"><i></i><i></i></span>
      <span class="micro">Gonzalo Quiroga — Desarrollador Full Stack</span>
    </div>
    <img class="mark" src="../../public/brand/gq-mark.png" alt="" />

    <main>
      <p class="statement">
        Desarrollo productos web<br />de punta a punta,
        <span class="fade">de la interfaz<br />al deploy.</span>
      </p>
    </main>

    <div class="band">
      <div class="hairline"></div>
      <ul class="micro">
        <li>React</li>
        <li>TypeScript</li>
        <li>Next.js</li>
        <li>Node.js</li>
        <li>Express</li>
        <li>PostgreSQL</li>
        <li>SQL Server</li>
        <li>Azure</li>
        <li>Vercel</li>
        <li>GitHub Actions</li>
        <li>Docker</li>
        <li>Jest</li>
        <li>Tailwind CSS</li>
      </ul>
    </div>
  </body>
</html>
