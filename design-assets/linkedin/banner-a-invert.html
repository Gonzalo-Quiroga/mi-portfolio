<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Banner LinkedIn A invertido — wordmark a la derecha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="banner-base.css" />
    <style>
      /*
        Espejo de la A: el wordmark pasa a la derecha y la metadata a la
        izquierda. El fondo se espeja con él (halo gris detrás del nombre,
        bloom cian arriba a la derecha) para que el peso visual siga
        cayendo del mismo lado que el bloque principal.
      */
      .bg {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            62% 120% at 26% 44%,
            oklch(0.34 0.004 285 / 0.5),
            transparent 72%
          ),
          radial-gradient(
            40% 85% at 18% 26%,
            oklch(0.44 0.004 285 / 0.2),
            transparent 68%
          ),
          radial-gradient(620px 320px at 88% 8%, var(--a1-ambient), transparent 70%),
          linear-gradient(to bottom, oklch(0.185 0.002 285) 0%, var(--background) 78%);
      }

      .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          110% 130% at 50% 45%,
          transparent 38%,
          var(--background) 100%
        );
      }

      /*
        Los márgenes seguros no se espejan: la foto de perfil de LinkedIn
        sigue tapando el ángulo inferior izquierdo, así que la metadata arranca
        igual en x=300 y el nombre muere a 96px del borde derecho.
      */
      main {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-right: var(--safe-right);
        padding-left: var(--safe-left);
      }

      .right {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        text-align: right;
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 24px;
      }

      .display {
        margin-bottom: 30px;
      }

      /* Segunda línea del wordmark apagada a gris: titular a dos tonos (§3.3). */
      .display .fade {
        color: oklch(0.62 0.004 285);
      }

      .rule {
        width: 620px;
        margin-bottom: 20px;
      }

      .meta {
        display: flex;
        gap: 18px;
        align-items: center;
      }

      .dot {
        display: block;
        width: 4px;
        height: 4px;
        background: color-mix(in oklch, var(--muted-foreground) 50%, transparent);
      }

      /*
        Mismo agrupamiento por proximidad que en la A: el dominio se separa y
        las dos líneas grises quedan pegadas como un solo bloque.
      */
      .left {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }

      .left .url {
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <div class="bg"></div>
    <div class="vignette"></div>

    <!--
      Mismas tres marcas que la A: la de abajo a la izquierda quedaría bajo la
      foto de perfil, así que se mantiene la de abajo a la derecha.
    -->
    <div class="corners">
      <i style="top: 28px; left: 28px"></i>
      <i style="top: 28px; right: 28px"></i>
      <i style="bottom: 28px; right: 28px"></i>
    </div>

    <main>
      <!-- Sin rol ni empresa, igual que en la A: solo lo que no caduca. -->
      <div class="left">
        <span class="micro on url">gonzaloquiroga.dev</span>
        <span class="micro micro-dim">Arroyito, Córdoba, Argentina</span>
        <span class="micro micro-dim">Remoto GMT-3</span>
      </div>

      <div class="right">
        <div class="eyebrow">
          <span class="micro">Desarrollador Full Stack</span>
          <span class="marker"><i></i><i></i></span>
        </div>

        <h1 class="display">
          Gonzalo<br /><span class="fade">Quiroga</span>
        </h1>

        <div class="rule hairline"></div>

        <div class="meta micro">
          <span>React</span><span class="dot"></span>
          <span>Next.js</span><span class="dot"></span>
          <span>TypeScript</span><span class="dot"></span>
          <span>Node.js</span><span class="dot"></span>
          <span>Supabase</span>
        </div>
      </div>
    </main>
  </body>
</html>
