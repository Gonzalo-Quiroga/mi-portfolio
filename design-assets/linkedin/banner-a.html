<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Banner LinkedIn A — wordmark</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="banner-base.css" />
    <style>
      /*
        Fondo por capas del hero: negro de base, halo gris concentrado a la
        derecha (donde en el sitio emerge la foto), bloom cian ínfimo arriba
        a la izquierda. Todo muere contra el borde, nada termina en filo.
      */
      .bg {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            62% 120% at 74% 44%,
            oklch(0.34 0.004 285 / 0.5),
            transparent 72%
          ),
          radial-gradient(
            40% 85% at 82% 26%,
            oklch(0.44 0.004 285 / 0.2),
            transparent 68%
          ),
          radial-gradient(620px 320px at 12% 8%, var(--a1-ambient), transparent 70%),
          linear-gradient(to bottom, oklch(0.185 0.002 285) 0%, var(--background) 78%);
      }

      .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          110% 130% at 50% 45%,
          transparent 38%,
          var(--background) 100%
        );
      }

      main {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-right: var(--safe-right);
        padding-left: var(--safe-left);
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 24px;
      }

      .display {
        margin-bottom: 30px;
      }

      /* Segunda línea del wordmark apagada a gris: titular a dos tonos (§3.3). */
      .display .fade {
        color: oklch(0.62 0.004 285);
      }

      .rule {
        width: 620px;
        margin-bottom: 20px;
      }

      .meta {
        display: flex;
        gap: 18px;
        align-items: center;
      }

      .dot {
        display: block;
        width: 4px;
        height: 4px;
        background: color-mix(in oklch, var(--muted-foreground) 50%, transparent);
      }

      /*
        Espaciado desigual a propósito: el dominio se separa y las dos líneas
        grises quedan pegadas entre sí. Por proximidad se leen como un solo
        bloque de metadata en vez de como tres datos sueltos.
      */
      .right {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
        text-align: right;
      }

      .right .url {
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <div class="bg"></div>
    <div class="vignette"></div>

    <!-- Marcas de registro: encuadran el lienzo sin dibujar una caja. -->
    <div class="corners">
      <i style="top: 28px; left: 28px"></i>
      <i style="top: 28px; right: 28px"></i>
      <i style="bottom: 28px; right: 28px"></i>
    </div>

    <main>
      <div class="left">
        <div class="eyebrow">
          <span class="marker"><i></i><i></i></span>
          <span class="micro">Desarrollador Full Stack</span>
        </div>

        <h1 class="display">
          Gonzalo<br /><span class="fade">Quiroga</span>
        </h1>

        <div class="rule hairline"></div>

        <div class="meta micro">
          <span>React</span><span class="dot"></span>
          <span>Next.js</span><span class="dot"></span>
          <span>TypeScript</span><span class="dot"></span>
          <span>Node.js</span><span class="dot"></span>
          <span>Supabase</span>
        </div>
      </div>

      <!--
        Bloque de la derecha sin rol ni empresa: el banner tiene que seguir
        sirviendo si cambia el puesto o el empleador. Queda lo que no caduca —
        el portfolio propio y desde dónde trabajo.
      -->
      <div class="right">
        <span class="micro on url">gonzaloquiroga.dev</span>
        <span class="micro micro-dim">Arroyito, Córdoba, Argentina</span>
        <span class="micro micro-dim">Remoto GMT-3</span>
      </div>
    </main>
  </body>
</html>
